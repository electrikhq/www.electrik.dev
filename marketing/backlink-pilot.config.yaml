# Canonical Electrik product config for backlink-pilot.
# The runnable copy lives at:
#   /Users/neerajsohal/lab/backlink-pilot/config.electrik.yaml
#
# New agent: follow marketing/BACKLINK_RUNBOOK.md
#
#   cd /Users/neerajsohal/lab/backlink-pilot
#   node src/cli.js submit <url> --config config.electrik.yaml --engine bb

product:
  name: "Electrik"
  url: "https://electrik.dev"
  description: "Laravel SaaS starter kit: auth, teams, and Stripe billing as a Composer package"
  long_description: |
    Electrik is a Laravel SaaS starter kit shipped as a Composer package (not
    copy-on-install). It includes authentication, teams with invites and Spatie
    permissions, Stripe billing via Cashier on the team, onboarding, 2FA, and a
    Slate 3 UI shell. Full features ship in source under Business Source License
    1.1 with a free Additional Use Grant for personal, educational, open-source,
    and pre-revenue indie use. Commercial products need a commercial license.
  email: "hello@neerajkumar.name"
  categories:
    - developer-tools
    - saas
  pricing: freemium

  logo_url: "https://electrik.dev/images/electrik-mark.png"
  github_url: "https://github.com/electrikhq/electrik"
  twitter: "electrikhq"
  features:
    - "Auth, teams, roles, and Stripe Cashier on teams"
    - "Livewire 4 + Electrik Slate 3 UI"
    - "Vendor package model — code stays in the Electrik namespace"
    - "BSL free grant for indies; commercial license for companies"
    - "Docs + llms.txt for AI agents"

credentials:
  saashub:
    email: ""
    password: ""
  uneed:
    email: ""
    password: ""

utm:
  enabled: true
  base_url: "https://electrik.dev"
  medium: "directory"
  campaign: "backlink-electrik"

indexnow:
  key: ""

browser:
  engine: bb
  headless: true
  slow_mo: 100
  timeout: 30000
  screenshot_dir: "./screenshots/electrik"

bb_browser:
  auto_update: true
  update_interval_hours: 24

pacing:
  min_interval_ms: 60000
  same_site_interval_ms: 3600000
